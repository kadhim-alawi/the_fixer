[project]
name = "the-fixer"
version = "0.1.0"
description = "Autonomous problem-resolution agent. Give it a problem. Walk away."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[tool.uv]
package = false
